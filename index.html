<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 링크</title>
    <!-- 눈누 프리텐다드 폰트 적용 (깔끔하고 세련된 서체) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #ffffff; /* 흰색 배경 */
            color: #111111; /* 깊은 검정색 글씨 */
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111111;
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eeeeee; /* 부드러운 구분선 */
            letter-spacing: -0.5px;
        }
        ul {
            padding-left: 20px;
            line-height: 1.8;
            list-style-type: square; /* 단정한 사각형 불릿 형태 */
        }
        li {
            margin-bottom: 16px;
            font-size: 16px;
            color: #333333;
        }
        a {
            color: #0066cc; /* 가독성 좋은 깔끔한 블루 링크 */
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed transparent;
            transition: all 0.15s ease;
        }
        a:hover {
            color: #004499;
            text-decoration: none;
            border-bottom: 1px solid #004499; /* 마우스 올렸을 때만 깔끔한 밑줄 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>프로젝트 링크</h1>
        <ul>
            <li><a href="https://woojinchem-ai.com" target="_blank">우진켐 대책보고서 작성</a></li>
            <li><a href="https://phiting.vercel.app" target="_blank">주식 WTS(웹 트레이딩 시스템)</a></li>
        </ul>
    </div>
</body>
</html>
